<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask AI Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="chat-container">
        <div id="messages"></div>
        <input id="user-input" placeholder="Type your message..."/>
        <button onclick="sendMessageHandler()">Send</button>
    </div>

    <script>
        async function sendMessageHandler() {
            const input = document.getElementById("user-input");
            const msg = input.value;
            input.value = "";

            const msgDiv = document.createElement("div");
            msgDiv.textContent = "You: " + msg;
            document.getElementById("messages").appendChild(msgDiv);

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: msg})
                });
                const data = await response.json();

                const replyDiv = document.createElement("div");
                replyDiv.textContent = "AI: " + data.reply;
                document.getElementById("messages").appendChild(replyDiv);
            } catch (e) {
                const errorDiv = document.createElement("div");
                errorDiv.textContent = "Error: " + e;
                document.getElementById("messages").appendChild(errorDiv);
            }
        }
    </script>
</body>
</html>
